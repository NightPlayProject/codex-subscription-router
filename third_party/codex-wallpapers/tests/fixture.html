<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Codex shell test fixture</title><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui;color:#e8eaf0;background:#15171d}#shell{display:flex;height:100vh}.app-shell-left-panel{width:262px;flex:none;padding:12px}.select-none{height:calc(100vh - 24px);display:flex;flex-direction:column;padding:12px;background:#161820}.profile{margin-top:auto;display:flex;gap:10px;align-items:center}button{color:inherit;background:#262830;border:0;border-radius:8px;padding:8px}main{flex:1;background:#161820;padding:26px;min-width:0}main h1{font-size:28px;margin-top:50px}.composer-surface-chrome{margin-top:30px;padding:20px;background:#272934;border-radius:18px}textarea{width:100%;background:transparent;color:inherit;border:none;resize:none}[role=menu]{position:fixed;bottom:60px;left:20px;background:#171717;padding:5px;border-radius:16px;width:240px;z-index:20}[role=menuitem]{padding:5px 8px;border-radius:12px;outline:none}[role=menuitem]>div{display:flex;align-items:center;gap:8px}[role=menuitem]:focus{background:#333}[data-menu-label]{flex:1}[data-settings]{margin-top:30px;height:220px;background:#000}.group\/home-suggestions{display:flex;gap:10px}.group\/home-suggestions button{padding:22px;flex:1}
</style></head><body><div id="shell"><aside class="app-shell-left-panel"><div><div class="select-none"><strong>Codex · isolated test</strong><p>Projects</p><p>Conversations</p><button class="profile" id="profile" aria-label="Open profile menu" aria-expanded="false">● Test profile</button></div></div></aside><main data-app-shell-main-surface><h1>What would you like to create?</h1><p>Test preview, not a screenshot of the live Codex app.</p><div class="group/home-suggestions"><button>Explore code</button><button>Create an app</button></div><section data-composer-surface-variant="thread" class="composer-surface-chrome"><div data-composer-layout><textarea placeholder="Write your message"></textarea><button aria-label="Send message">↑</button></div></section><section data-settings class="electron:bg-surface windows:rounded-tl-lg">Settings</section><div data-app-shell-main-content-top-fade></div></main></div><script>
const p=document.querySelector('#profile');p.onclick=()=>{const current=document.querySelector('[role=menu]');if(current){current.remove();p.setAttribute('aria-expanded','false');return;}const m=document.createElement('div');m.setAttribute('role','menu');m.setAttribute('aria-labelledby',p.id);m.innerHTML='<div role="menuitem" tabindex="-1"><div><svg width="16" height="16"></svg><span data-menu-label> Settings</span><span>Ctrl+,</span></div></div><div role="menuitem" tabindex="-1"><div><svg></svg><span>Log out</span></div></div>';m.onkeydown=e=>{if(e.key==='Escape'){m.remove();p.setAttribute('aria-expanded','false');p.focus();}};document.body.append(m);p.setAttribute('aria-expanded','true');};
</script></body></html>
